name: Build plugin

on:
  push:
    branches: ["main", "improve/**", "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build and test
        run: gradle --no-daemon clean build integrationFixtureJar

      - name: Boot-test Paper 1.20.1 with online-mode=false
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail

          SERVER_DIR="$PWD/build/paper-integration"
          mkdir -p "$SERVER_DIR/plugins"

          USER_AGENT="SLogin-CI/1.0 (https://github.com/Yamekiteelyeso/SpigotAuth)"
          BUILDS=$(curl -fsSL \
            -H "User-Agent: $USER_AGENT" \
            "https://fill.papermc.io/v3/projects/paper/versions/1.20.1/builds")

          PAPER_URL=$(echo "$BUILDS" | jq -r \
            'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')

          if [ -z "$PAPER_URL" ]; then
            echo "No stable Paper 1.20.1 build was returned by PaperMC."
            exit 1
          fi

          curl -fL \
            -H "User-Agent: $USER_AGENT" \
            "$PAPER_URL" \
            -o "$SERVER_DIR/paper.jar"

          echo "eula=true" > "$SERVER_DIR/eula.txt"

          cat > "$SERVER_DIR/server.properties" <<'EOF'
          online-mode=false
          prevent-proxy-connections=false
          server-port=25579
          max-players=2
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          enable-query=false
          enable-rcon=true
          rcon.port=25580
          rcon.password=slogin-ci-ephemeral
          motd=SLogin CI
          EOF

          REPO_ROOT="$PWD"
          PLUGIN_JAR="$PWD/build/libs/SLogin-1.9.4.jar"
          CI_FIXTURE_JAR="$PWD/build/libs/SLogin-CI-Fixture.jar"

          test -f "$PLUGIN_JAR" || { echo "Missing production reobfuscated JAR"; exit 1; }
          test -f "$CI_FIXTURE_JAR" || { echo "Missing CI-only fixture JAR"; exit 1; }

          # Test-only mock classes must never be present in the distributed JAR.
          if unzip -Z1 "$PLUGIN_JAR" | grep -q 'ci/fixture/SessionStubPlugin'; then
            echo "SECURITY REGRESSION: test session verifier leaked into production JAR."
            exit 1
          fi

          cp "$PLUGIN_JAR" "$SERVER_DIR/plugins/SLogin.jar"
          cp "$CI_FIXTURE_JAR" "$SERVER_DIR/plugins/SLogin-CI-Fixture.jar"

          # Seed one already-known Premium identity so this smoke test does not
          # depend on the public profile lookup service. Ownership is NOT faked:
          # we only test that SLogin enters the encryption-challenge path.
          mkdir -p "$SERVER_DIR/plugins/SLogin"
          # Simulate a legacy 1.9.3 configuration with a custom translated
          # message. SLogin must migrate it into messages.yml without loss.
          cat > "$SERVER_DIR/plugins/SLogin/config.yml" <<'EOF_CONFIG'
          language: es
          messages:
            es:
              auth:
                registered: "&aCI_CUSTOM_LEGACY_MESSAGE"
          EOF_CONFIG

          cat > "$SERVER_DIR/plugins/SLogin/premium-preferences.yml" <<'EOF'
          names:
            notch:
              uuid: "069a79f4-44e9-4726-a5be-fca90e38aaf5"
              verified: true
            jeb_:
              uuid: "853c80ef-3c37-49fd-aa49-938b674adae6"
              verified: true
          EOF

          # A registered LOCAL account with a known Premium nickname must
          # receive the same official challenge; local account data remains
          # separate and preserved even after Premium verification.
          cat > "$SERVER_DIR/plugins/SLogin/accounts.yml" <<'EOF'
          accounts:
            jeb_: "placeholder-hash-not-used-by-this-protocol-smoke-test"
          EOF

          # /premium must challenge without a successful public nickname lookup.
          # This represents a LOCAL registered account that requested migration.
          cat >> "$SERVER_DIR/plugins/SLogin/accounts.yml" <<'EOF'
            PremiumPending: "placeholder-hash-not-used-by-this-protocol-smoke-test"
          EOF
          cat >> "$SERVER_DIR/plugins/SLogin/premium-preferences.yml" <<'EOF'
            premiumpending:
              verified: false
              pending: true
            migtocancel:
              verified: false
              pending: true
            manualpending:
              verified: false
              pending: true
          EOF

          cd "$SERVER_DIR"
          tail -f /dev/null | java -Xms512M -Xmx1G -jar paper.jar nogui \
            > server.log 2>&1 &
          SERVER_PID=$!

          READY=0
          for _ in $(seq 1 120); do
            if grep -q 'Done (' server.log 2>/dev/null; then
              READY=1
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat server.log
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            echo "Paper did not reach the ready state."
            exit 1
          fi

          # The old config.yml messages must be migrated automatically.
          test -f "$SERVER_DIR/plugins/SLogin/messages.yml"
          grep -q 'CI_CUSTOM_LEGACY_MESSAGE' "$SERVER_DIR/plugins/SLogin/messages.yml"
          if grep -q '^messages:' "$SERVER_DIR/plugins/SLogin/config.yml"; then
            echo "SLogin failed to separate legacy messages from config.yml."
            exit 1
          fi
          ls "$SERVER_DIR/plugins/SLogin"/config.yml.backup-messages-*

          # Protocol 763 (Minecraft 1.20.1): Handshake -> Login Start.
          # The seeded Premium identity must receive Login Encryption Request
          # packet id 0x01 even though server.properties uses online-mode=false.
          python3 - <<'PY'
          import socket
          import struct
          import secrets
          import hashlib
          import uuid
          import subprocess
          import tempfile
          from pathlib import Path

          HOST = "127.0.0.1"
          PORT = 25579
          PROTOCOL = 763
          USERNAME = "Notch"

          def varint(value):
              value &= 0xffffffff
              out = bytearray()
              while True:
                  b = value & 0x7f
                  value >>= 7
                  if value:
                      out.append(b | 0x80)
                  else:
                      out.append(b)
                      return bytes(out)

          def mc_string(value):
              data = value.encode("utf-8")
              return varint(len(data)) + data

          def send_packet(sock, payload):
              sock.sendall(varint(len(payload)) + payload)

          def read_varint(sock):
              result = 0
              shift = 0
              for _ in range(5):
                  raw = sock.recv(1)
                  if not raw:
                      raise RuntimeError("connection closed while reading VarInt")
                  byte = raw[0]
                  result |= (byte & 0x7f) << shift
                  if not (byte & 0x80):
                      return result
                  shift += 7
              raise RuntimeError("VarInt too large")

          def recv_exact(sock, count):
              data = bytearray()
              while len(data) < count:
                  chunk = sock.recv(count - len(data))
                  if not chunk:
                      raise RuntimeError("connection closed while reading packet")
                  data.extend(chunk)
              return bytes(data)

          def decode_varint(data, offset=0):
              result = 0
              shift = 0
              pos = offset
              for _ in range(5):
                  byte = data[pos]
                  pos += 1
                  result |= (byte & 0x7f) << shift
                  if not (byte & 0x80):
                      return result, pos
                  shift += 7
              raise RuntimeError("packet id VarInt too large")

          with socket.create_connection((HOST, PORT), timeout=10) as sock:
              sock.settimeout(10)

              handshake = (
                  varint(0x00)
                  + varint(PROTOCOL)
                  + mc_string(HOST)
                  + struct.pack(">H", PORT)
                  + varint(2)
              )
              send_packet(sock, handshake)

              # 1.20.1 ServerboundHelloPacket:
              # packet id 0x00, username, Optional<UUID>.
              login_start = varint(0x00) + mc_string(USERNAME) + b"\x00"
              send_packet(sock, login_start)

              packet_length = read_varint(sock)
              payload = recv_exact(sock, packet_length)
              packet_id, pos = decode_varint(payload)

              if packet_id != 0x01:
                  raise SystemExit(
                      f"Expected Login Encryption Request 0x01, got 0x{packet_id:02x}"
                  )

              server_id_len, pos = decode_varint(payload, pos)
              server_id = payload[pos:pos + server_id_len]
              pos += server_id_len

              public_key_len, pos = decode_varint(payload, pos)
              public_key = payload[pos:pos + public_key_len]
              pos += public_key_len

              challenge_len, pos = decode_varint(payload, pos)
              challenge = payload[pos:pos + challenge_len]
              pos += challenge_len

              if len(public_key) < 128:
                  raise SystemExit(
                      f"Encryption Request public key is too short: {len(public_key)}"
                  )
              if len(challenge) != 4:
                  raise SystemExit(
                      f"Expected 4-byte verify token, got {len(challenge)} bytes"
                  )
              if pos != len(payload):
                  raise SystemExit(
                      f"Unexpected trailing bytes in Encryption Request: {len(payload) - pos}"
                  )

              print(
                  "SLogin protocol smoke test: valid Encryption Request "
                  f"(serverId={server_id!r}, publicKey={len(public_key)} bytes, "
                  f"challenge={len(challenge)} bytes)."
              )

              # Send an actual RSA encrypted Login Encryption Response with a
              # deliberately corrupted token: ownership must be rejected,
              # not silently upgraded to Premium. No Microsoft credentials
              # or network-side Mojang success are simulated.
              with tempfile.TemporaryDirectory() as directory:
                  pubfile = Path(directory) / "server-public-key.der"
                  pubfile.write_bytes(public_key)

                  def rsa_encrypt(plain):
                      return subprocess.run(
                          ["openssl", "pkeyutl", "-encrypt", "-pubin",
                           "-inkey", str(pubfile), "-keyform", "DER",
                           "-pkeyopt", "rsa_padding_mode:pkcs1"],
                          input=plain,
                          check=True,
                          capture_output=True
                      ).stdout

                  secret_cipher = rsa_encrypt(secrets.token_bytes(16))
                  forged_token = bytes([challenge[0] ^ 0xFF]) + challenge[1:]
                  token_cipher = rsa_encrypt(forged_token)

              encryption_response = (
                  varint(0x01)
                  + varint(len(secret_cipher)) + secret_cipher
                  + varint(len(token_cipher)) + token_cipher
              )
              send_packet(sock, encryption_response)

              # A forged response must never receive Login Success (0x02).
              try:
                  response_len = read_varint(sock)
                  response = recv_exact(sock, response_len)
                  response_id, _ = decode_varint(response)
                  if response_id == 0x02:
                      raise SystemExit(
                          "SECURITY REGRESSION: forged Premium challenge received Login Success"
                      )
              except (ConnectionResetError, ConnectionAbortedError, RuntimeError):
                  pass
              print("SLogin protocol smoke test: forged RSA verify token was rejected.")

          # A client explicitly sending the offline UUID for an already
          # verified Premium name is rejected with a clear ownership kick.
          with socket.create_connection((HOST, PORT), timeout=10) as sock:
              sock.settimeout(10)
              send_packet(sock, (
                  varint(0x00) + varint(PROTOCOL) + mc_string(HOST)
                  + struct.pack(">H", PORT) + varint(2)
              ))
              digest = bytearray(hashlib.md5(b"OfflinePlayer:Notch").digest())
              digest[6] = (digest[6] & 0x0F) | 0x30
              digest[8] = (digest[8] & 0x3F) | 0x80
              offline_uuid = uuid.UUID(bytes=bytes(digest))
              send_packet(sock, varint(0x00) + mc_string("Notch")
                          + b"\x01" + offline_uuid.bytes)
              size = read_varint(sock)
              payload = recv_exact(sock, size)
              packet_id, pos = decode_varint(payload)
              if packet_id != 0x00:
                  raise SystemExit(
                      "SECURITY REGRESSION: offline Premium impersonator not kicked; "
                      f"received 0x{packet_id:02x}"
                  )
              reason_len, pos = decode_varint(payload, pos)
              reason = payload[pos:pos + reason_len].decode("utf-8")
              if "No eres el dueño de esta cuenta" not in reason:
                  raise SystemExit(f"Unexpected Premium kick message: {reason!r}")
              print("SLogin: offline Premium impersonation denied with ownership message.")

          # Pending /premium with no public UUID lookup must send the exact
          # same official Encryption Request and never bypass session proof.
          with socket.create_connection((HOST, PORT), timeout=10) as sock:
              sock.settimeout(10)
              handshake = (
                  varint(0x00)
                  + varint(PROTOCOL)
                  + mc_string(HOST)
                  + struct.pack(">H", PORT)
                  + varint(2)
              )
              send_packet(sock, handshake)
              send_packet(
                  sock,
                  varint(0x00) + mc_string("PremiumPending") + b"\x00"
              )
              packet_length = read_varint(sock)
              payload = recv_exact(sock, packet_length)
              packet_id, _ = decode_varint(payload)
              if packet_id != 0x01:
                  raise SystemExit(
                      f"Pending /premium expected Encryption Request 0x01, "
                      f"got 0x{packet_id:02x}"
                  )
              print("SLogin /premium smoke test: pending user receives Encryption Request.")

          # Premium-first must apply even when the name was already registered
          # locally. A known Premium UUID gets challenged instead of /login.
          with socket.create_connection((HOST, PORT), timeout=10) as sock:
              sock.settimeout(10)

              handshake = (
                  varint(0x00)
                  + varint(PROTOCOL)
                  + mc_string(HOST)
                  + struct.pack(">H", PORT)
                  + varint(2)
              )
              send_packet(sock, handshake)

              login_start = varint(0x00) + mc_string("jeb_") + b"\x00"
              send_packet(sock, login_start)

              packet_length = read_varint(sock)
              payload = recv_exact(sock, packet_length)
              packet_id, _ = decode_varint(payload)

              if packet_id != 0x01:
                  raise SystemExit(
                      "Registered Premium account jeb_ must receive "
                      f"an official Encryption Request, got 0x{packet_id:02x}."
                  )

              print(
                  "SLogin protocol smoke test: registered username jeb_ "
                  "received Premium Encryption Request despite local account."
              )
          PY

          # Full login integration using ONLY the CI fixture session service.
          # This sends a real RSA Encryption Response, enables AES/CFB8 and
          # waits for Login Success + Bukkit's authenticated PlayerJoinEvent.
          # The fixture plugin is absent from the production SLogin JAR.
          grep -q "CI_ONLY_SESSION_STUB_INSTALLED" server.log
          java -cp "$REPO_ROOT/build/classes/java/test" \
            ci.fixture.PremiumProtocolClient \
            PremiumPending 11111111-1111-4111-8111-111111111111 false
          java -cp "$REPO_ROOT/build/classes/java/test" \
            ci.fixture.PremiumProtocolClient \
            CI_PremiumFresh 22222222-2222-4222-8222-222222222222 true

          grep -q "CI_PREMIUM_JOIN name=PremiumPending uuid=11111111-1111-4111-8111-111111111111 authenticated=true" server.log
          grep -q "CI_PREMIUM_JOIN name=CI_PremiumFresh uuid=22222222-2222-4222-8222-222222222222 authenticated=true" server.log
          echo "SLogin mocked session integration: Premium migration and first-time auto-login both reached Login Success + authenticated join."

          # Exercise the actual Bukkit command dispatch through vanilla RCON
          # (not just plugin.yml metadata). Admin location commands must be
          # callable, including from console for read/remove operations.
          python3 - <<'PY_RCON'
          import socket
          import struct
          from pathlib import Path

          def read_exact(sock, n):
              data = bytearray()
              while len(data) < n:
                  piece = sock.recv(n - len(data))
                  if not piece:
                      raise RuntimeError("RCON connection unexpectedly closed")
                  data += piece
              return bytes(data)

          def send_rcon(sock, request_id, packet_type, message):
              body = struct.pack("<ii", request_id, packet_type)
              body += message.encode("utf-8") + b"\x00\x00"
              sock.sendall(struct.pack("<i", len(body)) + body)

          def recv_rcon(sock):
              length = struct.unpack("<i", read_exact(sock, 4))[0]
              if length < 10 or length > 65536:
                  raise RuntimeError(f"Invalid RCON response size: {length}")
              body = read_exact(sock, length)
              request_id, packet_type = struct.unpack_from("<ii", body)
              return request_id, packet_type, body[8:-2].decode("utf-8", "replace")

          with socket.create_connection(("127.0.0.1", 25580), timeout=10) as sock:
              sock.settimeout(10)
              send_rcon(sock, 100, 3, "slogin-ci-ephemeral")
              auth_id, _, _ = recv_rcon(sock)
              if auth_id != 100:
                  raise SystemExit("RCON authentication failed")

              for request_id, command, required in [
                  (101, "slogin status", "SLOGIN"),
                  (102, "slogin help", "SLOGIN"),
                  (103, "slogin spawnlogin show", "spawnlogin"),
                  (104, "slogin loginready show", "loginready"),
                  (105, "slogin spawnlogin delete", "spawnlogin"),
                  (106, "slogin loginready delete", "loginready"),
                  (107, "slogin premiumcancel MigToCancel", "cancelada"),
                  (108, "slogin premiumcancel MigToCancel", "no tiene"),
                  (109, "slogin premiumcheck bad!", "premiumcheck"),
                  (110, "slogin resetmessages", "mensajes restaurados"),
              ]:
                  send_rcon(sock, request_id, 2, command)
                  got_id, _, result = recv_rcon(sock)
                  if got_id != request_id or required.lower() not in result.lower():
                      raise SystemExit(
                          f"RCON command failed: /{command} "
                          f"(id={got_id}, response={result!r})"
                      )
                  print(f"SLogin RCON command test OK: /{command}")

              # Switch to manual-first onboarding in the running Paper server.
              settings_path = Path("plugins/SLogin/config.yml")
              settings_text = settings_path.read_text(encoding="utf-8")
              expected = "require-register-before-premium: false"
              if expected not in settings_text:
                  raise SystemExit("Missing default manual Premium setting.")
              settings_path.write_text(
                  settings_text.replace(expected,
                                        "require-register-before-premium: true", 1),
                  encoding="utf-8"
              )
              send_rcon(sock, 111, 2, "slogin reload")
              got_id, _, result = recv_rcon(sock)
              if got_id != 111 or "recargada" not in result.lower():
                  raise SystemExit(f"SLogin reload failed after enabling manual mode: {result!r}")
              print("SLogin switched to register-before-premium mode.")
          PY_RCON

          # Protocol behavior in manual-first mode must be local for unbound
          # names, yet remain a Mojang encryption challenge for verified names
          # and pending /premium migrations.
          python3 - <<'PY_MANUAL'
          import socket
          import struct
          import uuid

          HOST = "127.0.0.1"
          PORT = 25579

          def varint(value):
              encoded = bytearray()
              while True:
                  byte = value & 0x7f
                  value >>= 7
                  encoded.append(byte | 0x80 if value else byte)
                  if not value:
                      return bytes(encoded)

          def mc_string(s):
              b = s.encode("utf-8")
              return varint(len(b)) + b

          def recv_varint(sock):
              result = 0
              for shift in range(0, 35, 7):
                  chunk = sock.recv(1)
                  if not chunk:
                      raise RuntimeError("Connection closed before Login response")
                  byte = chunk[0]
                  result |= (byte & 0x7f) << shift
                  if not byte & 0x80:
                      return result
              raise RuntimeError("VarInt too large")

          def first_response(name, hint=None):
              with socket.create_connection((HOST, PORT), timeout=10) as sock:
                  sock.settimeout(10)
                  handshake = (
                      varint(0) + varint(763) + mc_string(HOST)
                      + struct.pack(">H", PORT) + varint(2)
                  )
                  sock.sendall(varint(len(handshake)) + handshake)
                  hello = varint(0) + mc_string(name)
                  if hint is None:
                      hello += b"\\x00"
                  else:
                      hello += b"\\x01" + hint.bytes
                  sock.sendall(varint(len(hello)) + hello)
                  size = recv_varint(sock)
                  data = bytearray()
                  while len(data) < size:
                      chunk = sock.recv(size - len(data))
                      if not chunk:
                          raise RuntimeError("Truncated Login response")
                      data += chunk
                  return data[0], bytes(data)

          no_hint_id, no_hint_packet = first_response("CI_ManualNoUUID")
          print(f"Manual local no-hint first packet: {no_hint_id:#x}, {no_hint_packet!r}")
          first, packet = first_response(
              "CI_ManualNew",
              uuid.UUID("33333333-3333-4333-8333-333333333333")
          )
          print(f"Manual local online-hint first packet: {first:#x}, {packet!r}")
          if no_hint_id not in (0x02, 0x03) or first not in (0x02, 0x03):
              raise SystemExit(
                  f"Manual mode new account expected offline login, noHint={no_hint_id:#x}, onlineHint={first:#x}"
              )
          for name in ("Notch", "ManualPending"):
              first, _ = first_response(name)
              if first != 0x01:
                  raise SystemExit(
                      f"Manual mode must protect {name} with a challenge, "
                      f"got {first:#x}"
                  )
          print("SLogin manual-first mode: unbound username takes offline "
                "registration flow; verified/pending names still require challenge.")
          PY_MANUAL

          if ! grep -q "El verify token del Encryption Response no coincide" server.log; then
            cat server.log
            echo "SLogin did not reject the forged Premium encryption response."
            exit 1
          fi
          echo "SLogin security smoke test: tampered Premium encryption response rejected."

          grep -q "SLogin v1.9.4" server.log
          grep -q "SLogin Smart Auth validado y activo para online-mode=false" server.log

          # Command-map smoke test: every public/admin command must have
          # actually resolved from plugin.yml and received its executor.
          for COMMAND in register login changepass premium slogin; do
            if ! grep -q "Comando registrado: /$COMMAND" server.log; then
              cat server.log
              echo "SLogin failed to register /$COMMAND"
              exit 1
            fi
          done
          echo "SLogin command registration smoke test: 5/5 registered."

          if grep -E "Error occurred while enabling SLogin|Could not load.*SLogin|\[SLogin\].*(SEVERE|ERROR)" server.log; then
            cat server.log
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            echo "SLogin emitted a runtime error during the Paper boot test."
            exit 1
          fi

          # Paper shutdown can block indefinitely on chunk IO / worker
          # threads in CI. Graceful shutdown first, then enforce a deadline.
          kill -TERM "$SERVER_PID" 2>/dev/null || true
          for _ in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Paper CI shutdown exceeded 30 seconds; terminating test JVM."
            kill -KILL "$SERVER_PID" 2>/dev/null || true
          fi
          wait "$SERVER_PID" 2>/dev/null || true

          cat server.log

      - uses: actions/upload-artifact@v4
        with:
          name: SLogin-1.9.4
          path: build/libs/SLogin-1.9.4.jar
          if-no-files-found: error
