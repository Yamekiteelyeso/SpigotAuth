name: Build plugin

on:
  push:
    branches: ["main", "improve/**", "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build and test
        run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: SpigotAuth-1.2.0
          path: build/libs/SpigotAuth-1.2.0.jar
          if-no-files-found: error
