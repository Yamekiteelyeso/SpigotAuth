name: SLogin
version: 2.0.0-26.3
main: com.example.spigotauth.SpigotAuth
api-version: '26.3'
author: Yamekiteelyeso
description: "SLogin: Synex Login — autenticación Premium y offline para Paper 26.3."
commands:
  register:
    description: Register an offline account.
    usage: /register <password> <confirm>
    aliases: [r, reg]
  login:
    description: Log in to an offline account.
    usage: /login <password>
    aliases: [l, log]
  changepass:
    description: Change your local account password.
    usage: /changepass <old-password> <new-password>
    aliases: [changepassword]
  premium:
    description: Mark your own account for Premium verification.
    usage: /premium
  slogin:
    description: SLogin management, diagnostics, and login spawn locations.
    usage: /slogin <help|status|reload|spawnlogin|loginready|premiumcancel|premiumcheck|resetmessages>
    aliases: [sloginadmin]
permissions:
  slogin.admin:
    description: Allows SLogin administration commands.
    default: op
