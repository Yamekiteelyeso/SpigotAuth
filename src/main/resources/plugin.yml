name: SLogin
version: 1.3.0
main: com.example.spigotauth.SpigotAuth
api-version: '1.20'
author: Yamekiteelyeso
description: "SLogin: Synex Login — autenticación Premium y offline para Paper 1.20.1."
commands:
  register:
    description: Register an offline account.
    usage: /register <password> <confirm>
    aliases: [reg]
  login:
    description: Log in to an offline account.
    usage: /login <password>
    aliases: [l]
  slogin:
    description: SLogin administration.
    usage: /slogin reload
permissions:
  slogin.admin:
    description: Allows SLogin administration commands.
    default: op
