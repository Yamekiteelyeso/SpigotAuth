name: SpigotAuth
version: 1.2.0
main: com.example.spigotauth.SpigotAuth
api-version: '1.20'
author: Yamekiteelyeso
description: Secure authentication with Microsoft account ownership verification.
commands:
  register:
    description: Crea una cuenta protegida con contraseña.
    usage: /register <contraseña> <confirmar>
    aliases: [reg]
  login:
    description: Inicia sesión en tu cuenta local.
    usage: /login <contraseña>
    aliases: [l]
  premiumlogin:
    description: Verifica la propiedad de tu cuenta Minecraft Java mediante Microsoft.
    usage: /premiumlogin
    aliases: [plogin, premium]
