name: SpigotAuth
version: 1.2.0
main: com.example.spigotauth.SpigotAuth
api-version: '1.20'
author: Yamekiteelyeso
description: Smart Authentication standalone para Paper 1.20.1 con cuentas Premium y offline.
commands:
  register:
    description: Crea una cuenta protegida con contraseña.
    usage: /register <contraseña> <confirmar>
    aliases: [reg]
  login:
    description: Inicia sesión en tu cuenta.
    usage: /login <contraseña>
    aliases: [l]
