# Seguridad de cuentas
min-password-length: 8
max-password-length: 64
max-attempts: 5
lock-minutes: 5
login-timeout-seconds: 60

# Smart Authentication para servidores standalone offline-mode.
# FastLogin + ProtocolLib realizan la verificación criptográfica de sesión.
smart-auth:
  enabled: true
  provider: FASTLOGIN
  auto-register-premium: true
  premium-uuid: true
  require-existing-account-link: true

# Detección informativa de perfiles públicos por Mojang.
# Nunca se utiliza como prueba de propiedad.
premium-cache-minutes: 10
