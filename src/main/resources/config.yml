# Seguridad de cuentas locales
min-password-length: 8
max-password-length: 64
max-attempts: 5
lock-minutes: 5
login-timeout-seconds: 60

# Descubrimiento de perfiles Java en la API oficial de Mojang.
# IMPORTANTE: este lookup NO demuestra propiedad de la cuenta.
premium-cache-minutes: 10

smart-auth:
  # Tiempo máximo de una consulta al servicio oficial de sesión.
  # Un timeout/error durante un desafío Premium debe fallar cerrado.
  session-timeout-ms: 5000

  # Verificación Premium automática en Paper 1.20.1.
  # true: una cuenta Premium que complete el challenge oficial entra
  # directamente sin /register ni /login.
  enabled: true
