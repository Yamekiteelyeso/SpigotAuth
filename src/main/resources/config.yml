# ============================================================
# SLogin — Synex Login
# ============================================================
# Idioma de los mensajes: es / en
language: es

# Seguridad para cuentas offline/cracked
security:
  min-password-length: 8
  max-password-length: 64
  max-attempts: 5
  lock-minutes: 5
  login-timeout-seconds: 60

# Destinos opcionales para las fases de autenticación. No crean un punto
# automáticamente; usa /slogin spawnlogin y /slogin loginready para guardarlos.
# Se almacenan en plugins/SLogin/locations.yml (incluye mundo y orientación).
teleports:
  on-join-to-spawnlogin: true
  after-auth-to-loginready: true

# Cache del lookup de perfiles Java.
premium-cache-minutes: 10

smart-auth:
  enabled: true

  # Muestra en consola cada etapa del handshake Premium.
  # Úsalo para diagnosticar builds específicas de Paper.
  debug: false

  # Paper 1.20.1 únicamente.
  # Si está activo, un nick que exista como Premium puede recibir el challenge
  # oficial incluso en su primer acceso, similar a nLogin Premium.
  challenge-if-premium-nickname: true

  # También intenta verificar por Mojang los nombres que ya aparecen en
  # accounts.yml. Si la sesión Premium se verifica, entra sin /login.
  # La contraseña local no se borra: un nombre coincidente no demuestra
  # que ambas identidades sean la misma persona.
  # Nota: un cliente offline con un nombre Premium recibirá el challenge
  # oficial y no podrá completar esa conexión; debe usar nombre offline.
  auto-login-registered-premium: true

  # Después de /register o /login, avisa al dueño de una cuenta local cuando
  # su nick también existe como Premium y le ofrece usar /premium.
  premium-question: true

  # SLogin solo omite /register y /login después de validar la sesión oficial
  # y comprobar que UUID + nombre coinciden con el perfil esperado.
  session-timeout-ms: 5000

  # Si Mojang no responde:
  # false = nombres no protegidos pueden seguir por login offline.
  # true  = se rechazan todos los logins hasta poder verificar.
  fail-closed-on-lookup-error: false

  # /premium guarda el UUID Premium esperado y requiere reconectar para
  # ejecutar el challenge de cifrado antes de PlayerJoinEvent.
  premium-command-reconnect: true

# Mensajes editables. El idioma activo se elige arriba con language: es/en.
messages:
  es:
    prefix: "&8[&b&lSLOGIN&8] &r"
    premium:
      verified:
        - "&8&m--------------------------------"
        - "&a&l✓ CUENTA PREMIUM VERIFICADA"
        - "&7¡Bienvenido, &f{player}&7! No necesitas contraseña."
        - "&8&m--------------------------------"
      save-error: "&cNo se pudo guardar tu identidad Premium. Inténtalo de nuevo."
      verification-unavailable: "&cNo se pudo verificar tu cuenta Premium ahora mismo. Inténtalo de nuevo."
      verification-start-error: "&cNo se pudo iniciar la verificación Premium."
      incompatible-login-state: "&cTu conexión llegó en un estado de login no compatible."
      question:
        - ""
        - "&e¿Tu cuenta de Minecraft es Premium?"
        - "&7Si quieres entrar automáticamente en futuros accesos, usa &f/premium&7."
        - "&7Solo se activará después de verificar que realmente eres el dueño."
        - ""
      command-ready:
        - ""
        - "&8&m                                        "
        - "&b&lSLOGIN &8• &f&lMODO PREMIUM"
        - "&7Tu solicitud está lista, &f{player}&7."
        - ""
        - "&f➜ &7Sal del servidor y vuelve a entrar"
        - "&f➜ &7Utiliza el launcher oficial de Minecraft"
        - "&f➜ &7Verificaremos tu cuenta con Mojang"
        - ""
        - "&e¡Importante! &7Tu contraseña sigue guardada"
        - "&7hasta confirmar que eres el propietario."
        - "&8&m                                        "
      command-disabled: "{prefix}&cLa verificación Premium está desactivada. &7Pide a un administrador que revise &f/slogin status&7."
      command-usage: "{prefix}&eUso: &f/premium"
      command-register-first: "{prefix}&cPrimero debes tener una cuenta local registrada y haber iniciado sesión."
      command-checking: "{prefix}&7La verificación se realizará al reconectar con el launcher oficial."
      command-not-found: "{prefix}&cNo existe una cuenta Premium de Minecraft Java con tu nombre."
      command-unavailable: "{prefix}&cMojang no está disponible ahora mismo. Inténtalo más tarde."
      command-save-error: "{prefix}&cNo se pudo guardar tu preferencia Premium."
      command-enabled: "{prefix}&aModo Premium preparado. &7En tu siguiente conexión SLogin verificará tu sesión oficial."
      command-pending: "{prefix}&eTu modo Premium está pendiente. &7Reconecta con Minecraft original para verificarlo."
      command-already: "{prefix}&aTu identidad ya está protegida como Premium."
      command-reconnect: "&bSLogin &8» &fVuelve a entrar con tu Minecraft original para confirmar Premium."
    auth:
      already-authenticated: "{prefix}&aYa estás autenticado."
      registered: "{prefix}&a&l✓ &fRegistro completado. ¡Disfruta del servidor!"
      logged-in: "{prefix}&a&l✓ &fSesión iniciada. ¡Bienvenido otra vez!"
      wrong-password: "{prefix}&cContraseña incorrecta. &7Intentos restantes: &f{remaining}&7."
      locked: "{prefix}&cDemasiados intentos. &7Espera &f{seconds}s&7."
      locked-kick: "&cDemasiados intentos de acceso.\n&7Vuelve a intentarlo en &f{minutes} minutos&7."
      timeout-kick: "&cTiempo de autenticación agotado.\n&7Vuelve a entrar para intentarlo otra vez."
      chat-blocked: "{prefix}&cAutentícate antes de usar el chat."
      command-blocked: "{prefix}&cAutentícate antes de usar otros comandos."
    register:
      prompt:
        - "&8&m--------------------------------"
        - "&b&lCREA TU CUENTA"
        - "&7Para jugar, registra una contraseña:"
        - "&f/register <contraseña> <confirmar>"
        - "&7También puedes usar &f/r <contraseña> <confirmar>"
