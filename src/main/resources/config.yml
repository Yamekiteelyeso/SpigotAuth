# ============================================================
# SLogin — Synex Login
# ============================================================
# Idioma de los mensajes: es / en
language: es

# Seguridad para cuentas offline/cracked
security:
  min-password-length: 8
  max-password-length: 64
  max-attempts: 5
  # Los intentos fallidos sobreviven a desconexiones dentro de esta ventana.
  attempt-window-seconds: 600
  lock-minutes: 5
  login-timeout-seconds: 60

# Destinos opcionales para las fases de autenticación. No crean un punto
# automáticamente; usa /slogin spawnlogin y /slogin loginready para guardarlos.
# Se almacenan en plugins/SLogin/locations.yml (incluye mundo y orientación).
teleports:
  on-join-to-spawnlogin: true
  after-auth-to-loginready: true

# Cache del lookup de perfiles Java.
premium-cache-minutes: 10
# Los nombres no encontrados se guardan durante menos tiempo para evitar
# que un 404 temporal impida el primer ingreso de una cuenta original.
premium-negative-cache-seconds: 45

smart-auth:
  enabled: true

  # false (default): login automático de cuentas Premium verificadas por Mojang.
  # true: cuentas nuevas deben /register, luego /premium y reconectar usando
  # su launcher oficial. Cuentas Premium YA verificadas conservan auto-login.
  # IMPORTANTE: en este modo, un nick Premium aún no vinculado puede
  # registrarse con contraseña local; no implica propiedad Premium.
  require-register-before-premium: false

  # Muestra en consola cada etapa del handshake Premium.
  # Úsalo para diagnosticar builds específicas de Paper.
  debug: false

  # Paper 1.20.1 únicamente.
  # Si está activo, un nick que exista como Premium puede recibir el challenge
  # oficial incluso en su primer acceso, similar a nLogin Premium.
  challenge-if-premium-nickname: true

  # En 1.20.1, el cliente puede anunciar su UUID en Login Start.
  # Un UUID v4 solo sirve para decidir si pedir la prueba de sesión Premium.
  # NO autoriza por sí solo: SLogin siempre exige cifrado + hasJoinedServer.
  # Puedes desactivarlo si tu launcher offline envía UUIDs v4 inventados.
  challenge-if-client-online-uuid: true

  # También intenta verificar por Mojang los nombres que ya aparecen en
  # accounts.yml. Si la sesión Premium se verifica, entra sin /login.
  # La contraseña local no se borra: un nombre coincidente no demuestra
  # que ambas identidades sean la misma persona.
  # Nota: un cliente offline con un nombre Premium recibirá el challenge
  # oficial y no podrá completar esa conexión; debe usar nombre offline.
  auto-login-registered-premium: true

  # Después de /register o /login, avisa al dueño de una cuenta local cuando
  # su nick también existe como Premium y le ofrece usar /premium.
  premium-question: true

  # SLogin solo omite /register y /login después de validar la sesión oficial
  # y comprobar que UUID + nombre coinciden con el perfil esperado.
  session-timeout-ms: 10000

  # Si Mojang no responde:
  # false = nombres no protegidos pueden seguir por login offline.
  # true  = se rechazan todos los logins hasta poder verificar.
  fail-closed-on-lookup-error: false

  # /premium se usa para migrar una cuenta local ya autenticada.
  # El UUID Premium solo se guarda tras verificar la sesión con Mojang.
  # No elimina la contraseña local al detectar un nombre coincidente.
  # Una cuenta cracked con nombre Premium puede requerir otro nombre si
  # el challenge está activado; el cliente offline no puede probar Premium.

