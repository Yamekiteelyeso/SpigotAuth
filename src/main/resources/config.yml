# ============================================================
# SLogin — Synex Login
# ============================================================
# Idioma de los mensajes: es / en
language: es

# Seguridad para cuentas offline/cracked
security:
  min-password-length: 8
  max-password-length: 64
  max-attempts: 5
  lock-minutes: 5
  login-timeout-seconds: 60

# Cache del lookup de perfiles Java.
premium-cache-minutes: 10

smart-auth:
  enabled: true

  # Muestra en consola cada etapa del handshake Premium.
  # Úsalo para diagnosticar builds específicas de Paper.
  debug: false

  # Paper 1.20.1 únicamente.
  # Si está activo, un nick que exista como Premium puede recibir el challenge
  # oficial incluso en su primer acceso, similar a nLogin Premium.
  challenge-if-premium-nickname: true

  # Después de /register o /login, avisa al dueño de una cuenta local cuando
  # su nick también existe como Premium y le ofrece usar /premium.
  premium-question: true

  # SLogin solo omite /register y /login después de validar la sesión oficial
  # y comprobar que UUID + nombre coinciden con el perfil esperado.
  session-timeout-ms: 5000

  # Si Mojang no responde:
  # false = nombres no protegidos pueden seguir por login offline.
  # true  = se rechazan todos los logins hasta poder verificar.
  fail-closed-on-lookup-error: false

  # /premium guarda el UUID Premium esperado y requiere reconectar para
  # ejecutar el challenge de cifrado antes de PlayerJoinEvent.
  premium-command-reconnect: true

# Mensajes editables. El idioma activo se elige arriba con language: es/en.
messages:
  es:
    prefix: "&8[&bSLogin&8] &r"
    premium:
      verified:
        - "&8&m--------------------------------"
        - "&a✔ &fCuenta Premium verificada."
        - "&7Bienvenido, &b{player}&7. Entraste automáticamente."
        - "&8&m--------------------------------"
      save-error: "&cNo se pudo guardar tu identidad Premium. Inténtalo de nuevo."
      verification-unavailable: "&cNo se pudo verificar tu cuenta Premium ahora mismo. Inténtalo de nuevo."
      verification-start-error: "&cNo se pudo iniciar la verificación Premium."
      incompatible-login-state: "&cTu conexión llegó en un estado de login no compatible."
      question:
        - ""
        - "&e¿Tu cuenta de Minecraft es Premium?"
        - "&7Si quieres entrar automáticamente en futuros accesos, usa &f/premium&7."
        - "&7Solo se activará después de verificar que realmente eres el dueño."
        - ""
      command-usage: "{prefix}&eUso: &f/premium"
      command-register-first: "{prefix}&cPrimero debes tener una cuenta local registrada y haber iniciado sesión."
      command-checking: "{prefix}&7Comprobando tu perfil Premium..."
      command-not-found: "{prefix}&cNo existe una cuenta Premium de Minecraft Java con tu nombre."
      command-unavailable: "{prefix}&cMojang no está disponible ahora mismo. Inténtalo más tarde."
      command-save-error: "{prefix}&cNo se pudo guardar tu preferencia Premium."
      command-enabled: "{prefix}&aModo Premium preparado. &7En tu siguiente conexión SLogin verificará tu sesión oficial."
      command-already: "{prefix}&aTu identidad ya está protegida como Premium."
      command-reconnect: "&aModo Premium preparado.\n&7Vuelve a entrar con tu cuenta Premium para verificarla."
    auth:
      already-authenticated: "{prefix}&aYa estás autenticado."
      registered: "{prefix}&a✔ Cuenta creada. Ya puedes jugar."
      logged-in: "{prefix}&a✔ Sesión iniciada. Bienvenido de vuelta."
      wrong-password: "{prefix}&cContraseña incorrecta. &7Intentos restantes: &f{remaining}&7."
      locked: "{prefix}&cDemasiados intentos. &7Espera &f{seconds}s&7."
      locked-kick: "&cDemasiados intentos de acceso.\n&7Vuelve a intentarlo en &f{minutes} minutos&7."
      timeout-kick: "&cTiempo de autenticación agotado.\n&7Vuelve a entrar para intentarlo otra vez."
      chat-blocked: "{prefix}&cAutentícate antes de usar el chat."
      command-blocked: "{prefix}&cAutentícate antes de usar otros comandos."
    register:
      prompt:
        - "&8&m--------------------------------"
        - "&bRegistro requerido"
        - "&7Crea una contraseña con:"
        - "&f/register <contraseña> <confirmar>"
        - "&7También puedes usar &f/r <contraseña> <confirmar>"
        - "&7Tienes &f{seconds}s &7para autenticarte."
        - "&8&m--------------------------------"
      already-registered: "{prefix}&eYa estás registrado. Usa &f/login <contraseña>&e."
      usage: "{prefix}&eUso: &f/register <contraseña> <confirmar>"
      length: "{prefix}&cLa contraseña debe tener entre &f{min}&c y &f{max}&c caracteres."
      mismatch: "{prefix}&cLas contraseñas no coinciden."
      save-error: "{prefix}&cNo se pudo guardar tu cuenta. Contacta a un administrador."
    login:
      prompt:
        - "&8&m--------------------------------"
        - "&bInicio de sesión"
        - "&7Usa &f/login <contraseña>"
        - "&7También puedes usar &f/l <contraseña>"
        - "&7Tienes &f{seconds}s &7para autenticarte."
        - "&8&m--------------------------------"
      not-registered: "{prefix}&eNo estás registrado. Usa &f/register <contraseña> <confirmar>&e."
      usage: "{prefix}&eUso: &f/login <contraseña> &7o &f/l <contraseña>"
    changepass:
      usage: "{prefix}&eUso: &f/changepass <contraseña-vieja> <contraseña-nueva>"
      not-local: "{prefix}&eLas cuentas Premium verificadas no usan contraseña local."
      wrong-old: "{prefix}&cLa contraseña actual es incorrecta."
      save-error: "{prefix}&cNo se pudo guardar la nueva contraseña."
      success: "{prefix}&a✔ Contraseña cambiada correctamente."
    admin:
      reload-ok: "{prefix}&aConfiguración recargada. Idioma activo: &f{language}&a."
      no-permission: "{prefix}&cNo tienes permiso."
    console:
      player-only: "{prefix}&cEste comando solo se puede usar dentro del juego."

  en:
    prefix: "&8[&bSLogin&8] &r"
    premium:
      verified:
        - "&8&m--------------------------------"
        - "&a✔ &fPremium account verified."
        - "&7Welcome, &b{player}&7. You were logged in automatically."
        - "&8&m--------------------------------"
      save-error: "&cYour Premium identity could not be saved. Try again."
      verification-unavailable: "&cYour Premium account could not be verified right now. Try again."
      verification-start-error: "&cPremium verification could not be started."
      incompatible-login-state: "&cYour connection reached an unsupported login state."
      question:
        - ""
        - "&eIs your Minecraft account Premium?"
        - "&7If you want automatic login on future joins, use &f/premium&7."
        - "&7It will only activate after SLogin proves you own that account."
        - ""
      command-usage: "{prefix}&eUsage: &f/premium"
      command-register-first: "{prefix}&cYou must first have a registered local account and be logged in."
      command-checking: "{prefix}&7Checking your Premium profile..."
      command-not-found: "{prefix}&cThere is no Premium Minecraft Java account with your username."
      command-unavailable: "{prefix}&cMojang is unavailable right now. Try again later."
      command-save-error: "{prefix}&cYour Premium preference could not be saved."
      command-enabled: "{prefix}&aPremium mode prepared. &7On your next connection SLogin will verify your official session."
      command-already: "{prefix}&aYour identity is already protected as Premium."
      command-reconnect: "&aPremium mode prepared.\n&7Reconnect using your Premium account to verify it."
    auth:
      already-authenticated: "{prefix}&aYou are already authenticated."
      registered: "{prefix}&a✔ Account created. You can now play."
      logged-in: "{prefix}&a✔ Logged in. Welcome back."
      wrong-password: "{prefix}&cIncorrect password. &7Attempts remaining: &f{remaining}&7."
      locked: "{prefix}&cToo many attempts. &7Wait &f{seconds}s&7."
      locked-kick: "&cToo many login attempts.\n&7Try again in &f{minutes} minutes&7."
      timeout-kick: "&cAuthentication timed out.\n&7Reconnect and try again."
      chat-blocked: "{prefix}&cAuthenticate before using chat."
      command-blocked: "{prefix}&cAuthenticate before using other commands."
    register:
      prompt:
        - "&8&m--------------------------------"
        - "&bRegistration required"
        - "&7Create a password with:"
        - "&f/register <password> <confirm>"
        - "&7You can also use &f/r <password> <confirm>"
        - "&7You have &f{seconds}s &7to authenticate."
        - "&8&m--------------------------------"
      already-registered: "{prefix}&eYou are already registered. Use &f/login <password>&e."
      usage: "{prefix}&eUsage: &f/register <password> <confirm>"
      length: "{prefix}&cPassword length must be between &f{min}&c and &f{max}&c characters."
      mismatch: "{prefix}&cPasswords do not match."
      save-error: "{prefix}&cYour account could not be saved. Contact an administrator."
    login:
      prompt:
        - "&8&m--------------------------------"
        - "&bLogin required"
        - "&7Use &f/login <password>"
        - "&7You can also use &f/l <password>"
        - "&7You have &f{seconds}s &7to authenticate."
        - "&8&m--------------------------------"
      not-registered: "{prefix}&eYou are not registered. Use &f/register <password> <confirm>&e."
      usage: "{prefix}&eUsage: &f/login <password> &7or &f/l <password>"
    changepass:
      usage: "{prefix}&eUsage: &f/changepass <old-password> <new-password>"
      not-local: "{prefix}&eVerified Premium accounts do not use a local password."
      wrong-old: "{prefix}&cYour current password is incorrect."
      save-error: "{prefix}&cThe new password could not be saved."
      success: "{prefix}&a✔ Password changed successfully."
    admin:
      reload-ok: "{prefix}&aConfiguration reloaded. Active language: &f{language}&a."
      no-permission: "{prefix}&cYou do not have permission."
    console:
      player-only: "{prefix}&cThis command can only be used in-game."
