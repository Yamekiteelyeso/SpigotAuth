    command-unavailable: "{prefix}&cMojang no está disponible ahora mismo. Inténtalo más tarde."
    command-save-error: "{prefix}&cNo se pudo guardar tu preferencia Premium."
    command-enabled: "{prefix}&aModo Premium preparado. &7En tu siguiente conexión SLogin verificará tu sesión oficial."
    command-pending: "{prefix}&eTu modo Premium está pendiente. &7Reconecta con Minecraft original para verificarlo."
    command-already: "{prefix}&aTu identidad ya está protegida como Premium."
    command-reconnect: "&bSLogin &8» &fVuelve a entrar con tu Minecraft original para confirmar Premium."
  auth:
    already-authenticated: "{prefix}&aYa estás autenticado."
    registered: "{prefix}&a✔ &fCuenta creada correctamente. &7Ya puedes jugar."
    logged-in: "{prefix}&a✔ &fSesión iniciada. &7¡Bienvenido de nuevo!"
    wrong-password: "{prefix}&c✘ &fContraseña incorrecta. &7Te quedan &f{remaining} &7intentos."
    locked: "{prefix}&cAcceso bloqueado temporalmente. &7Espera &f{seconds}s&7."
    locked-kick: "&b&lSLOGIN &8• &cACCESO BLOQUEADO\n&7Has superado el límite de intentos.\n&7Vuelve en &f{minutes} minutos&7."
    timeout-kick: "&b&lSLOGIN &8• &cTIEMPO AGOTADO\n&7No iniciaste sesión a tiempo.\n&7Reconecta para volver a intentarlo."
