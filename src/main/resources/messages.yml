    location-removed: "{prefix}&a✓ &7Punto &f{type} &7borrado. Ya no se teletransportará a ese destino."
    location-unset: "{prefix}&eEl punto &f{type} &eno está configurado."
    location-save-error: "{prefix}&cError al guardar locations.yml. Revisa los permisos de escritura."
    location-stand-on-block: "{prefix}&ePárate sobre un bloque antes de guardar esta ubicación."
    location-info: "{prefix}&b{type}&7: mundo &f{world} &8| &7X &f{x} &7Y &f{y} &7Z &f{z}"
    location-teleported: "{prefix}&a✓ &7Teletransportado a &f{type}&7."
    location-unavailable: "{prefix}&cNo se puede teletransportar a &f{type}&c. Comprueba el mundo y la ubicación."
    status-header: "&8&m----------------------------------------"
    status-server: "&b&lSLOGIN &f{version} &8| &7Minecraft &f{minecraft} &8| &7online-mode: &f{online}"
    status-premium: "&7Smart Auth: &f{state} &8| &7Premium registrado: &f{auto} &8| &7Lookup: &f{lookup}"
    status-premium-detail: "&7Config habilitada: &f{configured} &8| &7Diagnóstico: &f{reason}"
    status-auth-mode: "&7Ingreso Premium: &b{mode}"
    status-locations: "&7spawnlogin: &f{login} &8| &7loginready: &f{ready}"
  console:
    player-only: "{prefix}&cEste comando solo se puede usar dentro del juego."

