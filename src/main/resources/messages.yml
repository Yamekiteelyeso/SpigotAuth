    prompt:
      - "&b&lSLOGIN &8» &7Usa &b/login <contraseña>&7."
    not-registered: "{prefix}&eTodavía no tienes cuenta. &7Usa &b/register <contraseña> <confirmar>&7."
    usage: "{prefix}&eUso: &b/login <contraseña>"
