    incompatible-login-state: "&cTu conexión llegó en un estado de login no compatible."
    question:
      - ""
      - "&8▎ &b&lSLOGIN &8• &f¿Tienes Minecraft original?"
      - "&7Puedes vincularlo con &b/premium &7para entrar automáticamente."
      - "&8Solo se activa tras verificar tu sesión oficial."
    command-ready:
      - ""
      - "&8▎ &b&lSLOGIN &8• &fVINCULAR PREMIUM"
