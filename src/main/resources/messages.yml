    wrong-old: "{prefix}&cLa contraseña actual es incorrecta."
    save-error: "{prefix}&cNo se pudo guardar la nueva contraseña."
    success: "{prefix}&a✔ Contraseña cambiada correctamente."
  admin:
    reload-ok: "{prefix}&a✓ &fConfiguración recargada. Idioma: &b{language}&f."
    no-permission: "{prefix}&cNo tienes permiso para administrar SLogin."
