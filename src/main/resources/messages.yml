    premium-check-missing: "{prefix}&eEl nombre &f{player} &eno aparece en los servicios de perfiles consultados."
    premium-check-unavailable: "{prefix}&cNo se pudo completar la consulta para &f{player}&c. Comprueba DNS, proxy y acceso HTTP saliente."
    usage: "{prefix}&eUso: &f/slogin <help|status|reload|resetmessages|spawnlogin|loginready|premiumcancel|premiumcheck>"
    help-header: "&8&m----------------------------------------"
    help-commands: "&b&lSLOGIN &8• &fComandos administrativos: &7/slogin status, /slogin reload"
    help-spawnlogin: "&b/slogin spawnlogin &8[set|show|delete|tp] &7Punto para jugadores sin autenticar."
    help-loginready: "&b/slogin loginready &8[set|show|delete|tp] &7Punto después de iniciar sesión."
    help-location-actions: "&7Sin argumentos se guarda el bloque bajo tus pies. &fset &7edita, &fdelete &7borra, &fshow &7consulta, &ftp &7teletransporta."
