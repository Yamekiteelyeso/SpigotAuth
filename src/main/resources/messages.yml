# ============================================================
# SLogin — Mensajes ES / EN
# Personaliza los textos aquí. Recarga con /slogin reload.
# Para restaurar los predeterminados: /slogin resetmessages.
# El idioma activo se elige en config.yml con language: es/en.
# ============================================================
es:
  prefix: "&8[&b&lSLOGIN&8] &7» &r"
  premium:
    verified:
      - ""
      - "&8▎ &b&lSLOGIN &8• &a&lPREMIUM"
      - "&7Identidad oficial confirmada para &f{player}&7."
      - "&a✓ &fAcceso automático &8· &7Sin contraseña"
    save-error: "&cNo se pudo guardar tu identidad Premium. Inténtalo de nuevo."
    verification-unavailable: "&cMojang no respondió. Comprueba tu conexión e inténtalo de nuevo. Tu migración pendiente se conserva."
    verification-invalid: "&cTu sesión Premium no se pudo confirmar. Inicia sesión otra vez en el launcher oficial y reconecta."
    not-owner: "&b&lSLOGIN &8» &cNo eres el dueño de esta cuenta.\n&7Este nombre está protegido como &bPremium&7."
    protected-login: "&b&lSLOGIN &8» &cCuenta Premium protegida.\n&7Entra usando su sesión oficial de Minecraft."
