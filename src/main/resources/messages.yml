      - "&7Sal y vuelve a entrar con tu &flauncher oficial&7."
      - "&8Tu contraseña local seguirá guardada hasta verificarte."
    command-disabled: "{prefix}&cLa verificación Premium está desactivada. &7Pide a un administrador que revise &f/slogin status&7."
    command-usage: "{prefix}&eUso: &f/premium &8[&7status&8|&7cancel&8]"
    command-login-first: "{prefix}&ePrimero inicia sesión con &f/login &eo regístrate con &f/register&e."
    command-online-mode: "{prefix}&aTu servidor ya verifica cuentas originales con &fonline-mode=true&a."
    command-disabled-detail: "{prefix}&7Motivo: &f{reason}"
    command-not-pending: "{prefix}&7Modo Premium disponible. Usa &b/premium &7para vincular tu cuenta."
    command-nothing-to-cancel: "{prefix}&eNo tienes una migración Premium pendiente."
    command-cancelled: "{prefix}&a✓ &7Migración Premium cancelada. Puedes seguir usando tu cuenta local."
